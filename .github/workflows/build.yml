name: build
on:
  push:
  pull_request:
    types: [ opened, reopened, synchronize ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        id: install-deps
        run: |
          python -m pip install --upgrade pip build ruff==0.12 requests "typing_extensions>=4.3,<5"
          pip install -U -r requirements.txt

      - name: Build package
        run: |
          python -m build